services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND (FastAPI - Python)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospede-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/hospede_club}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
      - OMNIBEES_ENVIRONMENT=${OMNIBEES_ENVIRONMENT:-sandbox}
      - OMNIBEES_ENDPOINT_URL=${OMNIBEES_ENDPOINT_URL:-https://cert.api.omnibees.com/ota2014b/PullService.svc}
      - OMNIBEES_REQUESTOR_ID=${OMNIBEES_REQUESTOR_ID:-}
      - OMNIBEES_USERNAME=${OMNIBEES_USERNAME:-}
      - OMNIBEES_API_KEY=${OMNIBEES_API_KEY:-}
      - OMNIBEES_WEBHOOK_SECRET=${OMNIBEES_WEBHOOK_SECRET:-}
      - HOSPEDE_ADMIN_PASSCODE=${HOSPEDE_ADMIN_PASSCODE:-${VANTAGGI_ADMIN_PASSCODE:-${VELLUTO_ADMIN_PASSCODE:-}}}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. FRONTEND (Next.js - React / TypeScript)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospede-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:8000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/hospede_club}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. BANCO DE DADOS (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hospede-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hospede_club}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospede_club"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. DISPARADOR WHATSAPP WACLI (openclaw/wacli)
  # ----------------------------------------------------------------------------
  wacli:
    build:
      context: ./services/wacli
      dockerfile: Dockerfile
    container_name: hospede-wacli
    restart: unless-stopped
    ports:
      - "${WACLI_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - WACLI_API_KEY=${WACLI_API_KEY:-}
    volumes:
      - waclidata:/data

volumes:
  pgdata:
  waclidata:


services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND (FastAPI - Python)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospede-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DATABASE_URL=${DATABASE_URL:?Configure DATABASE_URL com a conexão interna do PostgreSQL}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
      - OMNIBEES_ENVIRONMENT=${OMNIBEES_ENVIRONMENT:-sandbox}
      - OMNIBEES_ENDPOINT_URL=${OMNIBEES_ENDPOINT_URL:-https://cert.api.omnibees.com/ota2014b/PullService.svc}
      - OMNIBEES_REQUESTOR_ID=${OMNIBEES_REQUESTOR_ID:-}
      - OMNIBEES_USERNAME=${OMNIBEES_USERNAME:-}
      - OMNIBEES_API_KEY=${OMNIBEES_API_KEY:-}
      - OMNIBEES_WEBHOOK_SECRET=${OMNIBEES_WEBHOOK_SECRET:-}
      - HOSPEDE_ADMIN_PASSCODE=${HOSPEDE_ADMIN_PASSCODE:-${VANTAGGI_ADMIN_PASSCODE:-${VELLUTO_ADMIN_PASSCODE:-}}}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. FRONTEND (Next.js - React / TypeScript)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospede-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:8000}
      - DATABASE_URL=${DATABASE_URL:?Configure DATABASE_URL com a conexão interna do PostgreSQL}
      - CUSTOMER_SESSION_SECRET=${CUSTOMER_SESSION_SECRET:-}
      - WACLI_ENDPOINT=${WACLI_ENDPOINT:-http://wacli:3001/send}
      - WACLI_API_KEY=${WACLI_API_KEY:-}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - MERCADOPAGO_TEST_ACCESS_TOKEN=${MERCADOPAGO_TEST_ACCESS_TOKEN:-}
      - MERCADOPAGO_TEST_PUBLIC_KEY=${MERCADOPAGO_TEST_PUBLIC_KEY:-}
      - MERCADOPAGO_TEST_WEBHOOK_SECRET=${MERCADOPAGO_TEST_WEBHOOK_SECRET:-}
      - CHECKOUT_MODE=${CHECKOUT_MODE:-}
      - HOTELBEDS_API_KEY=${HOTELBEDS_API_KEY:-}
      - HOTELBEDS_SECRET=${HOTELBEDS_SECRET:-}
      - HOTELBEDS_ENVIRONMENT=${HOTELBEDS_ENVIRONMENT:-test}
      - HOTELBEDS_ENDPOINT_URL=${HOTELBEDS_ENDPOINT_URL:-}
      - HOTELBEDS_MTLS_ENABLED=${HOTELBEDS_MTLS_ENABLED:-false}
      - HOTELBEDS_MTLS_CERT_PATH=${HOTELBEDS_MTLS_CERT_PATH:-}
      - HOTELBEDS_MTLS_KEY_PATH=${HOTELBEDS_MTLS_KEY_PATH:-}
      - HOTELBEDS_MTLS_CERT_PEM=${HOTELBEDS_MTLS_CERT_PEM:-}
      - HOTELBEDS_MTLS_KEY_PEM=${HOTELBEDS_MTLS_KEY_PEM:-}
      - HOTELBEDS_MTLS_KEY_PASSWORD=${HOTELBEDS_MTLS_KEY_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. BANCO DE DADOS (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hospede-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hospede_club}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. DISPARADOR WHATSAPP WACLI (openclaw/wacli)
  # ----------------------------------------------------------------------------
  wacli:
    build:
      context: .
      dockerfile: services/wacli/Dockerfile
    container_name: hospede-wacli
    restart: unless-stopped
    ports:
      - "${WACLI_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - WACLI_API_KEY=${WACLI_API_KEY:-}
    volumes:
      - waclidata:/data

volumes:
  pgdata:
  waclidata:


services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND (FastAPI - Python)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velluto-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - OMNIBEES_ENVIRONMENT=${OMNIBEES_ENVIRONMENT:-sandbox}
      - OMNIBEES_ENDPOINT_URL=${OMNIBEES_ENDPOINT_URL:-https://cert.api.omnibees.com/ota2014b/PullService.svc}
      - OMNIBEES_REQUESTOR_ID=${OMNIBEES_REQUESTOR_ID:-}
      - OMNIBEES_USERNAME=${OMNIBEES_USERNAME:-}
      - OMNIBEES_API_KEY=${OMNIBEES_API_KEY:-}
      - OMNIBEES_WEBHOOK_SECRET=${OMNIBEES_WEBHOOK_SECRET:-}
      - VELLUTO_ADMIN_PASSCODE=${VELLUTO_ADMIN_PASSCODE:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. FRONTEND (Next.js - React / TypeScript)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velluto-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian Luxury -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2228"/>
      <stop offset="50%" stop-color="#11161B"/>
      <stop offset="100%" stop-color="#0A0D10"/>
    </linearGradient>

    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3DB"/>
      <stop offset="25%" stop-color="#E5C378"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#B8863B"/>
      <stop offset="100%" stop-color="#7A5218"/>
    </linearGradient>

    <!-- Ring Metallic Gradient (Diagonal reverse for shimmer) -->
    <linearGradient id="goldRing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DE"/>
      <stop offset="30%" stop-color="#C59747"/>
      <stop offset="70%" stop-color="#E8CA80"/>
      <stop offset="100%" stop-color="#8C5C1D"/>
    </linearGradient>

    <!-- Subtle Radial Glow behind Monogram -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#B8863B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#B8863B" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556472" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1D242B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadow for 3D Pop -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Luxury Obsidian Tone -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Ambient Glow in Center -->
  <circle cx="256" cy="256" r="180" fill="url(#goldGlow)"/>

  <!-- Outer Concentric Seal Ring -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#goldRing)" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- Inner Fine Beaded / Accent Ring -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>

  <!-- Top Accent: 4-Pointed Compass Star (Travel & Concierge Guidance) -->
  <g transform="translate(256, 108)" fill="url(#goldGrad)">
    <path d="M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFDF5"/>
  </g>

  <!-- Bottom Accent: 3 Micro Stars (Hospitality & Elegance) -->
  <g transform="translate(256, 404)" fill="url(#goldGrad)">
    <!-- Center star -->
    <path d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z"/>
    <!-- Left star -->
    <path d="M -26,-5 Q -26,0 -21,0 Q -26,0 -26,5 Q -26,0 -31,0 Q -26,0 -26,-5 Z" opacity="0.75"/>
    <!-- Right star -->
    <path d="M 26,-5 Q 26,0 31,0 Q 26,0 26,5 Q 26,0 21,0 Q 26,0 26,-5 Z" opacity="0.75"/>
  </g>

  <!-- Central Monogram 'H' (Aristocratic Serif Letterform) -->
  <g filter="url(#shadow)" fill="url(#goldGrad)">
    <!-- Left Vertical Stem + Serifs -->
    <path d="
      M 162 174 
      H 218 
      V 188 
      H 198 
      V 242 
      H 218 
      V 270 
      H 198 
      V 324 
      H 218 
      V 338 
      H 162 
      V 324 
      H 180 
      V 188 
      H 162 
      Z
    "/>
    <!-- Right Vertical Stem + Serifs -->
    <path d="
      M 294 174 
      H 350 
      V 188 
      H 332 
      V 242 
      H 312 
      V 270 
      H 332 
      V 324 
      H 350 
      V 338 
      H 294 
      V 324 
      H 312 
      V 188 
      H 294 
      Z
    "/>
    <!-- Center Crossbar connecting both stems -->
    <rect x="194" y="244" width="124" height="26" rx="2"/>
    <!-- Inner Crossbar Diamond Jewel -->
    <polygon points="256,247 265,257 256,267 247,257" fill="#FFFDF8" opacity="0.95"/>
  </g>
</svg>

